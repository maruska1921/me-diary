<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Me. — My Journey</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #172c43;
      font-family: Georgia, serif;
      color: #443b37;
    }
    .cover-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .book-cover {
      display: block;
      width: 100%;
      max-width: 490px;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 20px 55px rgba(0,0,0,.55);
      cursor: pointer;
      transition: transform .3s ease;
    }
    .book-cover:hover { transform: scale(1.02); }
    .book-button {
      border: 0;
      background: transparent;
      padding: 0;
      max-width: 490px;
      width: 100%;
      cursor: pointer;
    }
    .book-button:focus-visible {
      outline: 3px solid #e6c68c;
      outline-offset: 6px;
    }
    .chapter-page {
      display: none;
      min-height: 100vh;
      padding: 35px 18px;
      background: #172c43;
    }
    .chapter {
      max-width: 750px;
      margin: auto;
      background: #f5eddb;
      padding: 45px 30px;
      border: 2px solid #c5a778;
      border-radius: 8px;
      box-shadow: 0 12px 35px rgba(0,0,0,.3);
      text-align: center;
    }
    h1 { font-size: 2.5rem; color: #344e63; }
    p { font-size: 1.1rem; line-height: 1.8; }
    .back-button {
      margin-top: 30px;
      padding: 12px 22px;
      background: #344e63;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: Georgia, serif;
    }
  </style>
</head>
<body>
  <main>
    <section class="cover-page" id="coverPage">
      <button class="book-button" onclick="openBook()" aria-label="Open my diary">
        <img class="book-cover" src="me-cover.png.png" alt="Me. My magical diary cover">
      </button>
    </section>
    <section class="chapter-page" id="chapterPage">
      <div class="chapter">
        <h1>Chapter One</h1>
        <h2>Who Am I?</h2>
        <p>A journey to discover who I am, where I have been, and who I am becoming.</p>
        <p>This is where my story begins.</p>
        <button class="back-button" onclick="closeBook()">&#8592; Close the book</button>
      </div>
    </section>
  </main>
  <script>
    function openBook() {
      document.getElementById('coverPage').style.display = 'none';
      document.getElementById('chapterPage').style.display = 'block';
      window.scrollTo(0, 0);
    }
    function closeBook() {
      document.getElementById('chapterPage').style.display = 'none';
      document.getElementById('coverPage').style.display = 'flex';
      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
